name: Build final-size calibration

on:
  push:
    branches:
      - research/ring-end-size
    paths:
      - 'src/**'
      - 'BiteCountdown.csproj'
      - 'nuget.config'
      - '.github/workflows/build-calibration.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bite-countdown-calibration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify source and version identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import os, re, xml.etree.ElementTree as ET
          from pathlib import Path
          project = ET.parse('BiteCountdown.csproj').getroot()
          version = project.findtext('.//Version')
          assert project.findtext('.//AssemblyVersion') == version + '.0'
          assert project.findtext('.//FileVersion') == version + '.0'
          plugin = Path('src/Plugin.cs').read_text(encoding='utf-8')
          assert re.search(r'PluginVersion = "([^"]+)"', plugin).group(1) == version
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('CANDIDATE_VERSION=' + version + '\n')
          PY

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore and build clean Release
        shell: bash
        run: |
          set -euo pipefail
          rm -rf bin obj
          dotnet restore BiteCountdown.csproj --configfile nuget.config
          dotnet build BiteCountdown.csproj -c Release --no-restore --nologo

      - name: Stage research candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp bin/ReleasePlugin/BiteCountdown.dll artifacts/BiteCountdown.dll
          sha256=$(sha256sum artifacts/BiteCountdown.dll | awk '{print $1}')
          {
            echo 'Artifact: BiteCountdown.dll'
            echo "Version: $CANDIDATE_VERSION"
            echo "Source SHA: $GITHUB_SHA"
            echo "SHA-256: $sha256"
            echo 'Target: Graveyard Keeper 1.407'
            echo 'Research only: F3 panel, F4/F5 final ring size calibration'
          } > artifacts/BUILD_INFO.txt

      - name: Upload immutable research candidate
        uses: actions/upload-artifact@v4
        with:
          name: BiteCountdown-${{ env.CANDIDATE_VERSION }}-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
