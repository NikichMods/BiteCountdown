name: Publish Fishing Bite Countdown 1.0.7

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'BiteCountdown.csproj'
      - 'nuget.config'
      - 'RELEASE_NOTES.md'
      - '.github/workflows/release-1.0.7.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ACCEPTED_SOURCE_SHA: 2f513ebc9b527910645db4535372c7a4269142b5
      RELEASE_VERSION: 1.0.7

    steps:
      - name: Checkout stable source and release metadata
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify stable runtime matches accepted candidate
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code "$ACCEPTED_SOURCE_SHA" "$GITHUB_SHA" -- src/Plugin.cs BiteCountdown.csproj
          python3 - <<'PY'
          import os, re, xml.etree.ElementTree as ET
          from pathlib import Path
          project = ET.parse('BiteCountdown.csproj').getroot()
          version = project.findtext('.//Version')
          assert version == os.environ['RELEASE_VERSION']
          assert project.findtext('.//AssemblyVersion') == version + '.0'
          assert project.findtext('.//FileVersion') == version + '.0'
          plugin = Path('src/Plugin.cs').read_text(encoding='utf-8')
          assert re.search(r'PluginVersion = "([^"]+)"', plugin).group(1) == version
          assert Path('RELEASE_NOTES.md').read_text().splitlines()[0] == '# Fishing Bite Countdown ' + version
          PY

      - name: Verify exact accepted candidate artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          artifact_id=12098613942
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/$artifact_id" > artifact.json
          jq -e --arg sha "$ACCEPTED_SOURCE_SHA" --arg name "BiteCountdown-${RELEASE_VERSION}-${ACCEPTED_SOURCE_SHA}" \
            '.expired == false and .workflow_run.head_sha == $sha and .name == $name' artifact.json

          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/$artifact_id/zip" > candidate.zip
          mkdir -p release
          unzip -q candidate.zip -d release

          test -f release/BiteCountdown.dll
          test -f release/BUILD_INFO.txt

          recorded_source=$(sed -n 's/^Source SHA: //p' release/BUILD_INFO.txt)
          recorded_hash=$(sed -n 's/^SHA-256: //p' release/BUILD_INFO.txt)
          actual_hash=$(sha256sum release/BiteCountdown.dll | awk '{print $1}')

          test "$recorded_source" = "$ACCEPTED_SOURCE_SHA"
          test "$(sed -n 's/^Version: //p' release/BUILD_INFO.txt)" = "$RELEASE_VERSION"
          test "$recorded_hash" = "$actual_hash"
          test "$actual_hash" = "a2021039c48e629824c4cbb50088e1ccff39ced7d32e8d3b19f9bf52f930c8b9"

          printf '%s  %s\n' "$actual_hash" "BiteCountdown.dll" > release/SHA256SUMS.txt

      - name: Publish immutable 1.0.7 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view v1.0.7 >/dev/null 2>&1; then
            echo 'v1.0.7 already exists; refusing to overwrite immutable release.' >&2
            exit 1
          fi

          gh release create v1.0.7 \
            release/BiteCountdown.dll \
            release/SHA256SUMS.txt \
            --target "$ACCEPTED_SOURCE_SHA" \
            --title "Fishing Bite Countdown 1.0.7" \
            --notes-file RELEASE_NOTES.md
